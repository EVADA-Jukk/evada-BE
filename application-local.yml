spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/evada
    username: evada
    password: evada1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # 기존 DB에 처음 적용할 때 필요 (아래 설명)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cloud:
  aws:
    credentials:
      access-key: test
      secret-key: test
    region:
      static: ap-northeast-2
    s3:
      bucket: evada-local
      endpoint: http://localhost:4566   # localstack 사용 시. 실제 S3면 이 줄 삭제
