version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: evada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evada
      POSTGRES_USER: evada
      POSTGRES_PASSWORD: evada1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evada -d evada"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evada-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 로컬에서 S3를 흉내 내고 싶을 때만 사용 (선택 사항).
  # AWS 콘솔에서 실제 버킷을 쓸 거면 이 서비스는 지워도 됩니다.
  localstack:
    image: localstack/localstack:3
    container_name: evada-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: ap-northeast-2
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  postgres_data:
  redis_data:
  localstack_data:
