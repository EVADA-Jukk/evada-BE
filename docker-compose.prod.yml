version: "3.8"

services:
  app:
    image: ghcr.io/${GHCR_OWNER}/evada:latest
    container_name: evada-app
    restart: unless-stopped
    mem_limit: 1024m       # JVM -XX:MaxRAMPercentage=75.0 이 이 값을 기준으로 힙을 잡습니다 (~768MB)
    ports:
      - "8080:8080"
    env_file:
      - .env.prod
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: evada-postgres
    restart: unless-stopped
    mem_limit: 512m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evada-redis
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
